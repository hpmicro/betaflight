board:
    soc: HPM6360
    device: HPM6360xVMx
    openocd-soc: hpm6360-dual-core
    openocd-probe: cmsis_dap
    on-board-ram:
      type: sdram
      size: 32M
      width: 32bit
    on-board-flash:
      type: qspi-nor-flash
      size: 4M
    feature:
      - board_gpt_pin
      - board_motor_control
      - board_gpio_led
      - board_gpio_key
      - board_sdcard
